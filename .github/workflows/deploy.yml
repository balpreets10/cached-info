name: 🚀 Deploy cachedinfo.gamingdronzz.com

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force full deployment (clean slate)'
        required: false
        default: false
        type: boolean

env:
  APP_DIR: client
  BUILD_DIR: build
  PRODUCTION_TARGET: /var/www/cachedinfo.gamingdronzz.com
  STAGING_TARGET: /var/www/staging.cachedinfo.gamingdronzz.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Set deployment environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            FORCE="${{ github.event.inputs.force_deploy }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            FORCE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
            FORCE="false"
          else
            echo "Unsupported branch: $GITHUB_REF"
            exit 1
          fi

          TARGET="${{ env.PRODUCTION_TARGET }}"
          if [[ "$ENV" == "staging" ]]; then
            TARGET="${{ env.STAGING_TARGET }}"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "force_deploy=$FORCE" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build React app
        run: npm run build

      - name: 📋 Verify build output
        run: |
          echo "Build output directory: ${{ env.APP_DIR }}/${{ env.BUILD_DIR }}"
          ls -la "${{ env.BUILD_DIR }}"
          echo "Total build files: $(find "${{ env.BUILD_DIR }}" -type f | wc -l)"

      - name: 🧹 Clean target directory when forced
        if: ${{ steps.set-env.outputs.force_deploy == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            rm -rf "${{ steps.set-env.outputs.target }}"/*
            echo "✅ Cleaned target directory"

      - name: 🌐 Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          source: "${{ env.APP_DIR }}/${{ env.BUILD_DIR }}/"
          target: "${{ steps.set-env.outputs.target }}"
          strip_components: 3

      - name: ✅ Done
        run: |
          echo "Deployed to ${{ steps.set-env.outputs.environment }}"
          if [[ "${{ steps.set-env.outputs.environment }}" == "production" ]]; then
            echo "URL: https://cachedinfo.gamingdronzz.com"
          else
            echo "URL: https://staging.cachedinfo.gamingdronzz.com"
          fi
