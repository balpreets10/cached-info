name: 🚀 Deploy Cached Info.com

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force full deployment (clean slate)'
        required: false
        default: false
        type: boolean

env:
  WORKING_DIRECTORY: './client'

jobs:
  prepare:
    name: 🎯 Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy_staging: ${{ steps.set-env.outputs.deploy_staging }}
      deploy_production: ${{ steps.set-env.outputs.deploy_production }}
      force_deploy: ${{ steps.set-env.outputs.force_deploy }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Set Environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            FORCE="${{ github.event.inputs.force_deploy }}"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
            FORCE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            FORCE="false"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "force_deploy=$FORCE" >> $GITHUB_OUTPUT

          if [[ "$ENV" == "staging" ]]; then
            echo "deploy_staging=true" >> $GITHUB_OUTPUT
            echo "deploy_production=false" >> $GITHUB_OUTPUT
          else
            echo "deploy_staging=false" >> $GITHUB_OUTPUT
            echo "deploy_production=true" >> $GITHUB_OUTPUT
          fi

          echo "🎯 Deploying to: $ENV"
          echo "🔄 Force deploy: $FORCE"

  deploy-staging:
    name: 🚀 Deploy Client to Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_staging == 'true'
    environment:
      name: staging
      url: https://staging.cachedinfo.gamingdronzz.com

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build React (staging)
        env:
          # Per-environment build-time vars. Configure these under the GitHub
          # "staging" Environment (Settings > Environments) as Variables.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          # CRA inlines REACT_APP_* at build time; an empty var silently falls
          # back to http://localhost:5000 and ships a broken bundle. Fail loudly.
          if [[ -z "${REACT_APP_API_URL}" ]]; then
            echo "::error::REACT_APP_API_URL is unset for the staging environment. Set it under Settings > Environments > staging."
            exit 1
          fi
          npm run build

      - name: 📋 Verify Build Structure
        run: |
          echo "📂 Build directory contents:"
          ls -la build/
          echo "📊 Total build files: $(find build -type f | wc -l)"

      - name: 🧹 Clean Staging Directory (Full Clean only)
        if: needs.prepare.outputs.force_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/staging.cachedinfo.gamingdronzz.com/*
            echo "✅ Cleaned /var/www/staging.cachedinfo.gamingdronzz.com"

      - name: 🌐 Deploy to Staging via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a archive, -z compress, --delete removes stale files so the
          # web root exactly matches the fresh build (no orphaned/partial assets)
          switches: -avz --delete
          path: client/build/
          remote_path: /var/www/staging.cachedinfo.gamingdronzz.com/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: ✅ Staging Deployment Success
        run: |
          echo "🎉 Successfully deployed to staging!"
          echo "🌐 Visit: https://staging.cachedinfo.gamingdronzz.com"
          echo "📅 Deployed at: $(date)"
          if [[ "${{ needs.prepare.outputs.force_deploy }}" == "true" ]]; then
            echo "🔄 Full deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

  deploy-production:
    name: 🚀 Deploy Client to Production
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_production == 'true'
    environment:
      name: production
      url: https://cachedinfo.gamingdronzz.com

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build React (production)
        env:
          # Per-environment build-time vars. Configure these under the GitHub
          # "production" Environment (Settings > Environments) as Variables.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          # CRA inlines REACT_APP_* at build time; an empty var silently falls
          # back to http://localhost:5000 and ships a broken bundle. Fail loudly.
          if [[ -z "${REACT_APP_API_URL}" ]]; then
            echo "::error::REACT_APP_API_URL is unset for the production environment. Set it under Settings > Environments > production."
            exit 1
          fi
          npm run build

      - name: 📋 Verify Build Structure
        run: |
          echo "📂 Build directory contents:"
          ls -la build/
          echo "📊 Total build files: $(find build -type f | wc -l)"

      - name: 🧹 Clean Production Directory (Full Clean only)
        if: needs.prepare.outputs.force_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/cachedinfo.gamingdronzz.com/*
            echo "✅ Cleaned /var/www/cachedinfo.gamingdronzz.com"

      - name: 🌐 Deploy to Production via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a archive, -z compress, --delete removes stale files so the
          # web root exactly matches the fresh build (no orphaned/partial assets)
          switches: -avz --delete
          path: client/build/
          remote_path: /var/www/cachedinfo.gamingdronzz.com/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: ✅ Production Deployment Success
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "🌐 Visit: https://cachedinfo.gamingdronzz.com"
          echo "📅 Deployed at: $(date)"
          if [[ "${{ needs.prepare.outputs.force_deploy }}" == "true" ]]; then
            echo "🔄 Full deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

  deploy-server-staging:
    name: 🛠️ Deploy Server to Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_staging == 'true'
    environment:
      name: staging
      url: https://staging.cachedinfo.gamingdronzz.com

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Ship server code (and the committed deploy/ecosystem.config.cjs) to the
      # droplet. Never sync node_modules, env files, or .git — node_modules is
      # rebuilt on the box; secrets come from /etc/cinfo (written below).
      - name: 🌐 Ship Server Code via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.env* --exclude=.git
          path: server/
          remote_path: /var/www/staging.cachedinfo.gamingdronzz.com-api/server/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: 📤 Ship PM2 ecosystem config via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: deploy/ecosystem.config.cjs
          remote_path: /var/www/staging.cachedinfo.gamingdronzz.com-api/deploy/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: 🔐 Provision env, migrate & (re)start API
        uses: appleboy/ssh-action@v1.0.3
        env:
          NODE_ENV: staging
          PORT: '5001'
          CLIENT_ORIGIN: ${{ vars.SERVER_CLIENT_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          # Forward the resolved secrets/vars into the remote shell so the
          # heredoc below can write them to the root-owned env file.
          envs: NODE_ENV,PORT,CLIENT_ORIGIN,DATABASE_URL,JWT_ACCESS_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,BOOTSTRAP_ADMIN_EMAIL
          script: |
            set -euo pipefail
            APP_DIR=/var/www/staging.cachedinfo.gamingdronzz.com-api
            ENV_FILE=/etc/cinfo/api-staging.env
            PORT=5001

            # 1. Write the root-owned secret file from the injected values.
            #    chmod first (umask-safe), then fill — never world-readable.
            sudo install -m 600 -o root -g root /dev/null "$ENV_FILE"
            sudo tee "$ENV_FILE" >/dev/null <<EOF
            NODE_ENV=${NODE_ENV}
            PORT=${PORT}
            CLIENT_ORIGIN=${CLIENT_ORIGIN}
            DATABASE_URL=${DATABASE_URL}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
            EOF

            # 2. Install prod deps.
            cd "$APP_DIR/server"
            npm ci --omit=dev --no-audit --no-fund

            # 3. Run migrations with DATABASE_URL in the env (node-pg-migrate
            #    reads it from process env). Read it back from the file we just
            #    wrote so CI never echoes the secret into the build log.
            set -a; sudo cat "$ENV_FILE" > /tmp/cinfo-staging.env && . /tmp/cinfo-staging.env && rm -f /tmp/cinfo-staging.env; set +a
            npm run migrate

            # 3b. Seed RBAC roles/permissions/grants (+ bootstrap admin role if
            #     that user has signed in). Idempotent — safe on every deploy.
            npm run seed

            # 3c. Seed demo catalog + resources. Idempotent (catalog upserts;
            #     resources are owned by a seed user and replaced each run).
            npm run seed:catalog

            # 4. (Re)start the API under PM2. The ecosystem config reads the same
            #    env file, so --update-env picks up the latest secrets.
            cd "$APP_DIR"
            pm2 startOrReload deploy/ecosystem.config.cjs --only cinfo-api-staging --update-env
            pm2 save

            # 5. Smoke check — fail the deploy if the API isn't healthy.
            sleep 2
            curl -fsS "http://127.0.0.1:${PORT}/api/health"

      - name: ✅ Staging Server Deployment Success
        run: echo "🎉 Server deployed to staging on 127.0.0.1:5001"

  deploy-server-production:
    name: 🛠️ Deploy Server to Production
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_production == 'true'
    environment:
      name: production
      url: https://cachedinfo.gamingdronzz.com

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Ship Server Code via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.env* --exclude=.git
          path: server/
          remote_path: /var/www/cachedinfo.gamingdronzz.com-api/server/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: 📤 Ship PM2 ecosystem config via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: deploy/ecosystem.config.cjs
          remote_path: /var/www/cachedinfo.gamingdronzz.com-api/deploy/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: 🔐 Provision env, migrate & (re)start API
        uses: appleboy/ssh-action@v1.0.3
        env:
          NODE_ENV: production
          PORT: '5000'
          CLIENT_ORIGIN: ${{ vars.SERVER_CLIENT_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          envs: NODE_ENV,PORT,CLIENT_ORIGIN,DATABASE_URL,JWT_ACCESS_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,BOOTSTRAP_ADMIN_EMAIL
          script: |
            set -euo pipefail
            APP_DIR=/var/www/cachedinfo.gamingdronzz.com-api
            ENV_FILE=/etc/cinfo/api-production.env
            PORT=5000

            sudo install -m 600 -o root -g root /dev/null "$ENV_FILE"
            sudo tee "$ENV_FILE" >/dev/null <<EOF
            NODE_ENV=${NODE_ENV}
            PORT=${PORT}
            CLIENT_ORIGIN=${CLIENT_ORIGIN}
            DATABASE_URL=${DATABASE_URL}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
            EOF

            cd "$APP_DIR/server"
            npm ci --omit=dev --no-audit --no-fund

            set -a; sudo cat "$ENV_FILE" > /tmp/cinfo-production.env && . /tmp/cinfo-production.env && rm -f /tmp/cinfo-production.env; set +a
            npm run migrate

            # Seed RBAC roles/permissions/grants (+ bootstrap admin role if that
            # user has signed in). Idempotent — safe on every deploy.
            npm run seed

            # Seed demo catalog + resources. Idempotent (catalog upserts;
            # resources are owned by a seed user and replaced each run).
            npm run seed:catalog

            cd "$APP_DIR"
            pm2 startOrReload deploy/ecosystem.config.cjs --only cinfo-api-production --update-env
            pm2 save

            sleep 2
            curl -fsS "http://127.0.0.1:${PORT}/api/health"

      - name: ✅ Production Server Deployment Success
        run: echo "🎉 Server deployed to production on 127.0.0.1:5000"

  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging, deploy-production, deploy-server-staging, deploy-server-production]
    if: always()

    steps:
      - name: 📱 Notify Success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        run: |
          ENV="${{ needs.prepare.outputs.environment }}"
          FORCE="${{ needs.prepare.outputs.force_deploy }}"

          if [[ "$ENV" == "staging" ]]; then
            echo "✅ Staging deployment successful!"
            echo "🌐 Site: https://staging.cachedinfo.gamingdronzz.com"
          else
            echo "✅ Production deployment successful!"
            echo "🌐 Site: https://cachedinfo.gamingdronzz.com"
          fi

          if [[ "$FORCE" == "true" ]]; then
            echo "🔄 Full clean deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

      - name: 🚨 Notify Failure
        if: needs.prepare.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure' || needs.deploy-server-staging.result == 'failure' || needs.deploy-server-production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "🔍 Check the logs for details"
          echo "🔧 Possible issues:"
          echo "   - SSH credentials incorrect"
          echo "   - Server connectivity problems"
          echo "   - File permissions issues"
          echo "   - Build errors"
