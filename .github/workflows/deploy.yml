name: 🚀 Deploy Cached Info.com

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force full deployment (clean slate)'
        required: false
        default: false
        type: boolean

env:
  WORKING_DIRECTORY: './client'

jobs:
  prepare:
    name: 🎯 Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy_staging: ${{ steps.set-env.outputs.deploy_staging }}
      deploy_production: ${{ steps.set-env.outputs.deploy_production }}
      force_deploy: ${{ steps.set-env.outputs.force_deploy }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Set Environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            FORCE="${{ github.event.inputs.force_deploy }}"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
            FORCE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            FORCE="false"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "force_deploy=$FORCE" >> $GITHUB_OUTPUT

          if [[ "$ENV" == "staging" ]]; then
            echo "deploy_staging=true" >> $GITHUB_OUTPUT
            echo "deploy_production=false" >> $GITHUB_OUTPUT
          else
            echo "deploy_staging=false" >> $GITHUB_OUTPUT
            echo "deploy_production=true" >> $GITHUB_OUTPUT
          fi

          echo "🎯 Deploying to: $ENV"
          echo "🔄 Force deploy: $FORCE"

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_staging == 'true'
    environment:
      name: staging
      url: https://staging.cachedinfo.gamingdronzz.com

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build React (staging)
        env:
          # Per-environment build-time vars. Configure these under the GitHub
          # "staging" Environment (Settings > Environments) as Variables.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 📋 Verify Build Structure
        run: |
          echo "📂 Build directory contents:"
          ls -la build/
          echo "📊 Total build files: $(find build -type f | wc -l)"

      - name: 🧹 Clean Staging Directory (Full Clean only)
        if: needs.prepare.outputs.force_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/staging.cachedinfo.gamingdronzz.com/*
            echo "✅ Cleaned /var/www/staging.cachedinfo.gamingdronzz.com"

      - name: 🌐 Deploy to Staging via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a archive, -z compress, --delete removes stale files so the
          # web root exactly matches the fresh build (no orphaned/partial assets)
          switches: -avz --delete
          path: client/build/
          remote_path: /var/www/staging.cachedinfo.gamingdronzz.com/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: ✅ Staging Deployment Success
        run: |
          echo "🎉 Successfully deployed to staging!"
          echo "🌐 Visit: https://staging.cachedinfo.gamingdronzz.com"
          echo "📅 Deployed at: $(date)"
          if [[ "${{ needs.prepare.outputs.force_deploy }}" == "true" ]]; then
            echo "🔄 Full deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_production == 'true'
    environment:
      name: production
      url: https://cachedinfo.gamingdronzz.com

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build React (production)
        env:
          # Per-environment build-time vars. Configure these under the GitHub
          # "production" Environment (Settings > Environments) as Variables.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 📋 Verify Build Structure
        run: |
          echo "📂 Build directory contents:"
          ls -la build/
          echo "📊 Total build files: $(find build -type f | wc -l)"

      - name: 🧹 Clean Production Directory (Full Clean only)
        if: needs.prepare.outputs.force_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/cachedinfo.gamingdronzz.com/*
            echo "✅ Cleaned /var/www/cachedinfo.gamingdronzz.com"

      - name: 🌐 Deploy to Production via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a archive, -z compress, --delete removes stale files so the
          # web root exactly matches the fresh build (no orphaned/partial assets)
          switches: -avz --delete
          path: client/build/
          remote_path: /var/www/cachedinfo.gamingdronzz.com/
          remote_host: ${{ secrets.DO_SSH_HOST }}
          remote_user: ${{ secrets.DO_SSH_USER }}
          remote_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: ✅ Production Deployment Success
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "🌐 Visit: https://cachedinfo.gamingdronzz.com"
          echo "📅 Deployed at: $(date)"
          if [[ "${{ needs.prepare.outputs.force_deploy }}" == "true" ]]; then
            echo "🔄 Full deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: 📱 Notify Success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        run: |
          ENV="${{ needs.prepare.outputs.environment }}"
          FORCE="${{ needs.prepare.outputs.force_deploy }}"

          if [[ "$ENV" == "staging" ]]; then
            echo "✅ Staging deployment successful!"
            echo "🌐 Site: https://staging.cachedinfo.gamingdronzz.com"
          else
            echo "✅ Production deployment successful!"
            echo "🌐 Site: https://cachedinfo.gamingdronzz.com"
          fi

          if [[ "$FORCE" == "true" ]]; then
            echo "🔄 Full clean deployment completed"
          else
            echo "⚡ Incremental deployment completed"
          fi

      - name: 🚨 Notify Failure
        if: needs.prepare.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "🔍 Check the logs for details"
          echo "🔧 Possible issues:"
          echo "   - SSH credentials incorrect"
          echo "   - Server connectivity problems"
          echo "   - File permissions issues"
          echo "   - Build errors"
